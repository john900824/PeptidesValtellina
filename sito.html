  const allL = el("label", {}, el("input",{type:"checkbox", checked:filterState.cats.includes(ALL_CATS), onchange:(e)=>{if(e.target.checked)filterState.cats=[ALL_CATS]; else filterState.cats=filterState.cats.filter(c=>c!==ALL_CATS); productsView();}}), ALL_CATS);

function renderCards() {
  const cards = $("#cards");
  if (!cards) return;
  cards.innerHTML = "";
  const filtered = PRODUCTS.filter(p => {
    if (filterState.search && !p.name.toLowerCase().includes(filterState.search.toLowerCase())) return false;
    if (!filterState.cats.includes(ALL_CATS) && !filterState.cats.includes(p.category)) return false;
    if (filterState.purity.length && !filterState.purity.includes(p.purity)) return false;
    if (filterState.inStock && !p.in_stock) return false;
    if (p.price_eur > filterState.maxPrice) return false;
    return true;
  });
  const c = $("#count");
  if (c) c.textContent = filtered.length === 1 ? "1 composto" : `${filtered.length} composti`;
  filtered.forEach(p => {
    cards.appendChild(el("a", { class:"ccard", href:`#/products/${p.slug}`, onclick:(e)=>{e.preventDefault();route(`/products/${p.slug}`);} },
      el("div", { class:"imgwrap" },

  });

function scrollToId(id) {
  const t = document.getElementById(id);
  if (t) t.scrollIntoView({ behavior:"smooth" });
}

function attachScroll() {
  const nav = $("#nav");
  const onScroll = () => { if (window.scrollY > 20) nav.classList.add("scrolled"); else nav.classList.remove("scrolled"); };
  window.addEventListener("scroll", onScroll);
  onScroll();
}

function route(path) {
  window.location.hash = path;
  render();
}

function render() {
  let hash = window.location.hash.replace(/^#/, "") || "/";
  window.scrollTo(0, 0);
  if (hash.startsWith("/products/")) {
    detailView(hash.split("/")[2]);
  } else if (hash === "/products") {
    productsView();
  } else if (hash === "/certificati") {
    certificatesView();
  } else if (hash.startsWith("/policy/")) {
    policyView(hash.split("/")[2]);
  } else {
    homeView();
  }
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);
